name: CPU regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      KERAS_BACKEND: torch
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-tested.txt ruff==0.17.2
      - run: python -m pip check
      - run: python -m ruff check --select E9,F63,F7,F82 run.py runtime.py model.py experiment.py tests
      - run: python -m compileall -q run.py runtime.py model.py experiment.py tests legacy
      - run: python -m unittest discover -s tests -v
